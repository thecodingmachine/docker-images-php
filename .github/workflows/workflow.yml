name: Auto test and build v5

on:
  pull_request:
    branches:
      - 'v5'
  push:
    branches:
      - 'v5'
  schedule:
    - cron: '42 3 * * 0'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.5', '8.4', '8.3', '8.2']
        builder: [ {arch: "amd64", os: "ubuntu-24.04"}, {arch: "arm64", os: "ubuntu-24.04-arm"}]
    runs-on: ${{ matrix.builder.os }}
    name: Build&test ${{ matrix.php_version }} ${{ matrix.builder.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The layers of the targets built from another target are only found in the registry cache from BuildKit 0.35
          driver-opts: image=moby/buildkit:v0.35.0-rc1
      - name: Build
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          # The pull requests only read the cache of v5
          CACHE_REPO="ghcr.io/${{ github.repository_owner }}/php-cache" \
          CACHE_WRITE="${{ github.event_name != 'pull_request' && '1' || '0' }}" \
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --set "*.platform=linux/${{ matrix.builder.arch }}" \
            --progress=plain \
            php${PHP_VERSION//.} > build.log 2>&1 || { tail -n 50 build.log; exit 1; }
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.php_version }}-${{ matrix.builder.arch }}
          path: build.log
          retention-days: 7
      - name: Check the cache tags
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          CACHE_REPO="${{ github.repository_owner }}/php-cache"
          EXPECTED=$(CACHE_REPO="ghcr.io/${CACHE_REPO}" CACHE_WRITE=1 ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
            docker buildx bake --print --progress=quiet php${PHP_VERSION//.} \
            | jq -r '.target[]."cache-to"[]?.ref | sub(".*:"; "")' | sort)
          # Anonymous token: the cache package is public
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${CACHE_REPO}:pull" | jq -r .token)
          EXISTING=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${CACHE_REPO}/tags/list?n=1000" | jq -r '.tags[]' | sort)
          MISSING=$(comm -23 <(echo "${EXPECTED}") <(echo "${EXISTING}"))
          if [ -n "${MISSING}" ]; then
            echo "::warning::Cache tags not written (see the export lines of build.log): $(echo ${MISSING})"
          fi
      - name: Display tags built
        run: |
          docker image ls --filter="reference=ghcr.io/${{ github.repository_owner }}/php"  --format "{{.CreatedAt}}\t{{.Size}}\t{{.Repository}}:{{.Tag}}"
      - name: Test
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          PHP_VERSION="${PHP_VERSION}" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          BRANCH="v5" \
          PLATFORM="linux/${{ matrix.builder.arch }}" \
          VARIANTS="apache cli fpm" \
          NODE_VERSIONS="$(docker buildx bake --print --progress=quiet php${PHP_VERSION//.} | jq -r '[.target[].args.NODE_VERSION // empty] | unique | join(" ")')" \
          ./tests-suite/run_tests.sh
      - name: Publish specific arch version
        if: > # Only from the main repo
              github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          TAGS=$(REPO="ghcr.io/${{ github.repository_owner }}/php" \
              ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
              TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
              docker buildx bake \
                --print --progress=quiet \
                php${PHP_VERSION//.} | jq -r '.target[].tags // [] | .[]');
          # 4 images at the same time, with retries: ghcr.io sometimes answers "unknown blob"
          printf '%s\n' $TAGS | xargs -P 4 -I {} bash -c 'for i in 1 2 3; do docker push --quiet "{}" && exit 0; sleep 5; done; exit 1'

  merge-and-publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs:
      - build
    runs-on: ubuntu-latest
    name: Merge and publish ${{ matrix.php_version }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.5', '8.4', '8.3', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ github.repository_owner == 'thecodingmachine' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main
        with:
          release: 'v0.8.1'
      - name: Fetch minor version of php
        run: |
          # Pull amd64 slim image to get PHP version
          docker pull --quiet ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-cli-amd64
          # Retrieve minor
          PHP_PATCH_MINOR=`docker run --rm ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-cli-amd64 php -v | head -n1 | grep -P '\d+\.\d+\.\d+' -o | head -n1`
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}"
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}" >> $GITHUB_ENV
      - name: Get list of images for this PHP version
        id: get-images
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --print --progress=quiet \
            php${PHP_VERSION//.} | jq '.target[].tags // [] | .[]'
      - name: Create multiarch manifests
        run: |
          PHP_VERSION="${{ matrix.php_version }}"

          # Get all the published targets of the bake group
          TARGETS=$(docker buildx bake php${PHP_VERSION//.} --progress=quiet --print | jq -r '.target | to_entries[] | select(.value.tags) | .key')

          publish() {
            TARGET="$1"
            TAG_ORI=$(REPO="ghcr.io/${{ github.repository_owner }}/php" TAG_PREFIX="rc${GITHUB_RUN_ID}-" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")
            TAG_PATH=$(REPO="php" IS_RELEASE="1" PHP_PATCH_MINOR="${{ env.PHP_PATCH_MINOR }}" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[1]")
            TAG_MINOR=$(REPO="php" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")

            # Create manifest for rc tag (always)
            echo "Creating manifest: ${TARGET} - ${TAG_ORI}"
            docker buildx imagetools create --progress=plain -t "${TAG_ORI}" "${TAG_ORI}-amd64" "${TAG_ORI}-arm64"

            # Create manifest for PHP_PATCH
            regctl image copy "${TAG_ORI}" "ghcr.io/${{ github.repository_owner }}/${TAG_PATH}"
            # Create manifest for PHP_MINOR
            regctl image copy "${TAG_ORI}" "ghcr.io/${{ github.repository_owner }}/${TAG_MINOR}"

            # SAME FOR DOCKERHUB (for the official repository)
            if [ "${{ github.repository_owner }}" == "thecodingmachine" ]; then
                # Create manifest for PHP_PATCH_MINOR
                regctl image copy "${TAG_ORI}" "thecodingmachine/${TAG_PATH}"
                # Create manifest for PHP_VERSION
                regctl image copy "${TAG_ORI}" "thecodingmachine/${TAG_MINOR}"
            fi
          }
          export -f publish
          # 4 targets at the same time
          printf '%s\n' $TARGETS | xargs -P 4 -I {} bash -ec 'publish {}'
