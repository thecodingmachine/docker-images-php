name: Direct build v5 of legacy php

on:
  workflow_dispatch:
    inputs:
      vital_tests:
        description: 'Test files that must pass before publishing (tests-suite/*.sh, space separated)'
        default: 'php-security-patches.sh php-ini.sh php-extensions.sh users-rights.sh variant-apache.sh variant-fpm.sh'
        required: true
      no_cache:
        description: 'Build without cache, to get the latest PHP packages (security rebuild)'
        type: boolean
        default: true
      allow_arm64_failure:
        description: 'Publish the amd64 images even if arm64 failed (the X.Y tags keep their current arm64 image)'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
        variant: ['apache','cli','fpm']
        builder: [ {arch: "amd64", os: "ubuntu-24.04"}, {arch: "arm64", os: "ubuntu-24.04-arm"}]
    runs-on: ${{ matrix.builder.os }}
    env:
      # Non-maintained PHP versions: all the images. Maintained PHP versions: only the non-maintained NodeJS versions
      BAKE_GROUP: php${{ matrix.php_version }}-${{ matrix.variant }}-${{ contains(fromJSON('["8.1", "8.0", "7.4"]'), matrix.php_version) && 'all' || 'legacy-node' }}
    name: Build&test ${{ matrix.php_version }}-${{ matrix.variant }} ${{ matrix.builder.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --set "*.platform=linux/${{ matrix.builder.arch }}" \
            --set "*.output=type=registry" \
            --set "*.no-cache=${{ inputs.no_cache }}" \
            --progress=quiet \
            --load \
            ${BAKE_GROUP//.}
      - name: Display tags built
        run: |
          docker image ls --filter="reference=ghcr.io/${{ github.repository_owner }}/php"  --format "{{.CreatedAt}}\t{{.Size}}\t{{.Repository}}:{{.Tag}}"
          docker run --rm --platform=linux/${{ matrix.builder.arch }} \
            ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-${{ matrix.variant }}-${{ matrix.builder.arch }} \
            bash -c 'php -v | head -n1; dpkg-query -W "php${PHP_VERSION}-*" | sort' || true
      - name: Vital tests
        env:
          VITAL_TESTS: ${{ inputs.vital_tests }}
        run: |
          cd tests-suite
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          PHP_VERSION="${{ matrix.php_version }}" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          BRANCH="v5" \
          VARIANT="${{ matrix.variant }}" \
          PLATFORM="linux/${{ matrix.builder.arch }}" \
          ./bash_unit -f tap ${VITAL_TESTS}
      - name: Other tests (informative)
        continue-on-error: true
        env:
          VITAL_TESTS: ${{ inputs.vital_tests }}
        run: |
          cd tests-suite
          OTHER_TESTS=""
          for TEST in *.sh; do
            [[ " ${VITAL_TESTS} " == *" ${TEST} "* ]] || OTHER_TESTS="${OTHER_TESTS} ${TEST}"
          done
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          PHP_VERSION="${{ matrix.php_version }}" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          BRANCH="v5" \
          VARIANT="${{ matrix.variant }}" \
          PLATFORM="linux/${{ matrix.builder.arch }}" \
          ./bash_unit -f tap ${OTHER_TESTS}
      - name: Mark as validated
        run: echo "${{ matrix.php_version }}-${{ matrix.variant }}-${{ matrix.builder.arch }}" > validated.txt
      - name: Upload validation
        uses: actions/upload-artifact@v7
        with:
          name: validated-${{ matrix.php_version }}-${{ matrix.variant }}-${{ matrix.builder.arch }}
          path: validated.txt
          retention-days: 1

  merge-and-publish:
    # Publish each version/variant validated on every architecture (or on amd64 with allow_arm64_failure), even if others failed
    if: ${{ !cancelled() }}
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      # Non-maintained PHP versions: all the images. Maintained PHP versions: only the non-maintained NodeJS versions
      BAKE_GROUP: php${{ matrix.php_version }}-${{ matrix.variant }}-${{ contains(fromJSON('["8.1", "8.0", "7.4"]'), matrix.php_version) && 'all' || 'legacy-node' }}
    name: Merge and publish ${{ matrix.php_version }}-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
        variant: ['apache','cli','fpm']
    steps:
      - name: Download validations
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: validated-${{ matrix.php_version }}-${{ matrix.variant }}-*
          path: validated
          merge-multiple: false
      - name: Check the validated architectures
        run: |
          VALIDATED="validated/validated-${{ matrix.php_version }}-${{ matrix.variant }}"
          if [ ! -f "${VALIDATED}-amd64/validated.txt" ]; then
            echo "::error::${{ matrix.php_version }}-${{ matrix.variant }} amd64 did not pass the vital tests: not published"
            exit 1
          fi
          if [ -f "${VALIDATED}-arm64/validated.txt" ]; then
            echo "ARM64_VALIDATED=true" >> $GITHUB_ENV
          elif [ "${{ inputs.allow_arm64_failure }}" == "true" ]; then
            echo "::warning::${{ matrix.php_version }}-${{ matrix.variant }} arm64 did not pass the vital tests: only amd64 is updated"
            echo "ARM64_VALIDATED=false" >> $GITHUB_ENV
          else
            echo "::error::${{ matrix.php_version }}-${{ matrix.variant }} arm64 did not pass the vital tests: not published"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ github.repository_owner == 'thecodingmachine' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main
        with:
          release: 'v0.8.1'
      - name: Fetch minor version of php
        run: |
          # Pull amd64 slim image to get PHP version
          docker pull --quiet ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-${{ matrix.variant }}-amd64
          # Retrieve minor
          PHP_PATCH_MINOR=`docker run --rm ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-${{ matrix.variant }}-amd64 php -v | head -n1 | grep -P '\d+\.\d+\.\d+' -o | head -n1`
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}"
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}" >> $GITHUB_ENV
      - name: Get list of images for this variant
        id: get-images
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --print --progress=quiet \
            ${BAKE_GROUP//.} | jq '.target[].tags[]'
      - name: Create multiarch manifests
        run: |
          PHP_VERSION="${{ matrix.php_version }}"
          # Registry the users pull the images from
          PUBLISHED_REPO=$([ "${{ github.repository_owner }}" == "thecodingmachine" ] && echo "docker.io/thecodingmachine" || echo "ghcr.io/${{ github.repository_owner }}")

          # Get all targets from the bake group
          TARGETS=$(docker buildx bake ${BAKE_GROUP//.} --progress=quiet --print | jq -r ".group[\"${BAKE_GROUP//.}\"].targets[]")
          # The slim and fat images of the maintained PHP versions are published by the main workflow
          if [[ "${BAKE_GROUP}" == *-legacy-node ]]; then
            TARGETS=$(echo "${TARGETS}" | grep -- '-node')
          fi

          for TARGET in $TARGETS; do
            TAG_ORI=$(REPO="ghcr.io/${{ github.repository_owner }}/php" TAG_PREFIX="rc${GITHUB_RUN_ID}-" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")
            TAG_PATH=$(REPO="php" PHP_PATCH_MINOR="${{ env.PHP_PATCH_MINOR }}" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")
            TAG_MINOR=$(REPO="php" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")

            # Create manifest for rc tag (always)
            echo "Creating manifest: ${TARGET} - ${TAG_ORI}"
            TAG_ORI_MINOR="${TAG_ORI}"
            if [ "${ARM64_VALIDATED}" == "true" ]; then
              docker buildx imagetools create --progress=plain -t "${TAG_ORI}" "${TAG_ORI}-amd64" "${TAG_ORI}-arm64"
            else
              # The PHP_PATCH tag only has amd64, the PHP_MINOR tag keeps the arm64 image it currently has
              docker buildx imagetools create --progress=plain -t "${TAG_ORI}" "${TAG_ORI}-amd64"
              ARM64_DIGEST=$(docker buildx imagetools inspect --raw "${PUBLISHED_REPO}/${TAG_MINOR}" 2>/dev/null \
                | jq -r '.manifests[]? | select(.platform.architecture == "arm64") | .digest' | head -n1)
              if [ -n "${ARM64_DIGEST}" ]; then
                regctl image copy "${PUBLISHED_REPO}/${TAG_MINOR%%:*}@${ARM64_DIGEST}" "${TAG_ORI}-arm64-published"
                TAG_ORI_MINOR="${TAG_ORI}-minor"
                docker buildx imagetools create --progress=plain -t "${TAG_ORI_MINOR}" "${TAG_ORI}-amd64" "${TAG_ORI}-arm64-published"
              fi
            fi

            # Create manifest for PHP_PATCH
            regctl image copy "${TAG_ORI}" "ghcr.io/${{ github.repository_owner }}/${TAG_PATH}"
            # Create manifest for PHP_MINOR
            regctl image copy "${TAG_ORI_MINOR}" "ghcr.io/${{ github.repository_owner }}/${TAG_MINOR}"

            # SAME FOR DOCKERHUB (for the official repository)
            if [ "${{ github.repository_owner }}" == "thecodingmachine" ]; then
                # Create manifest for PHP_PATCH_MINOR
                regctl image copy "${TAG_ORI}" "thecodingmachine/${TAG_PATH}"
                # Create manifest for PHP_VERSION
                regctl image copy "${TAG_ORI_MINOR}" "thecodingmachine/${TAG_MINOR}"
            fi
          done
