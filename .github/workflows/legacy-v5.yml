name: Direct build v5 of legacy php

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'Only this PHP version (e.g. 8.1), all if empty'
        default: ''
      package_amd64:
        description: 'Version of the sury PHP packages expected on amd64'
        default: ''
      package_arm64:
        description: 'Version of the sury PHP packages expected on arm64'
        default: ''
      legacy_patch_suffix:
        description: 'Suffix of the X.Y.Z tags of 7.4, 8.0 and 8.1 (e.g. php2shell), no X.Y.Z tag for them if empty'
        default: ''
      security_issue:
        description: 'Issue that gets the result of the build (security releases)'
        default: ''

# A build of one PHP version (security release) cancels the previous one of the same version
concurrency:
  group: ${{ inputs.php_version && format('legacy-{0}', inputs.php_version) || github.run_id }}
  cancel-in-progress: ${{ inputs.php_version && true || false }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.php_version && format('["{0}"]', inputs.php_version) || '["8.5", "8.4", "8.3", "8.2", "8.1", "8.0", "7.4"]') }}
        variant: ['apache','cli','fpm']
        builder: [ {arch: "amd64", os: "ubuntu-24.04"}, {arch: "arm64", os: "ubuntu-24.04-arm"}]
    runs-on: ${{ matrix.builder.os }}
    env:
      # Non-maintained PHP versions: all the images. Maintained PHP versions: only the non-maintained NodeJS versions
      BAKE_GROUP: php${{ matrix.php_version }}-${{ matrix.variant }}-${{ contains(fromJSON('["8.1", "8.0", "7.4"]'), matrix.php_version) && 'all' || 'legacy-node' }}
      PHP_PACKAGE_VERSION: ${{ matrix.builder.arch == 'amd64' && inputs.package_amd64 || inputs.package_arm64 }}
    name: Build&test ${{ matrix.php_version }}-${{ matrix.variant }} ${{ matrix.builder.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --set "*.platform=linux/${{ matrix.builder.arch }}" \
            --set "*.args.PHP_PACKAGE_VERSION=${PHP_PACKAGE_VERSION}" \
            --progress=quiet \
            ${BAKE_GROUP//.}
      - name: Check the version of the PHP packages
        if: ${{ env.PHP_PACKAGE_VERSION != '' }}
        run: |
          INSTALLED=$(docker run --rm ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-${{ matrix.variant }}-${{ matrix.builder.arch }} \
            dpkg-query -W -f '${Version}' php${{ matrix.php_version }}-cli)
          echo "Installed: ${INSTALLED}, expected: ${PHP_PACKAGE_VERSION} or newer"
          dpkg --compare-versions "${INSTALLED}" ge "${PHP_PACKAGE_VERSION}"
      - name: Display tags built
        run: |
          docker image ls --filter="reference=ghcr.io/${{ github.repository_owner }}/php"  --format "{{.CreatedAt}}\t{{.Size}}\t{{.Repository}}:{{.Tag}}"
      - name: Test
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          PHP_VERSION="${{ matrix.php_version }}" \
          ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
          BRANCH="v5" \
          VARIANT="${{ matrix.variant }}" \
          PLATFORM="linux/${{ matrix.builder.arch }}" \
          ./tests-suite/bash_unit -f tap ./tests-suite/*.sh
      - name: Publish specific arch version
        run: |
          TAGS=$(REPO="ghcr.io/${{ github.repository_owner }}/php" \
              ARCH_SUFFIX="-${{ matrix.builder.arch }}" \
              TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
              docker buildx bake \
                --print --progress=quiet \
                ${BAKE_GROUP//.} | jq -r '.target[].tags // [] | .[]');
          for TAG in $TAGS; do docker push --quiet ${TAG}; done;

  merge-and-publish:
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      # Non-maintained PHP versions: all the images. Maintained PHP versions: only the non-maintained NodeJS versions
      BAKE_GROUP: php${{ matrix.php_version }}-${{ matrix.variant }}-${{ contains(fromJSON('["8.1", "8.0", "7.4"]'), matrix.php_version) && 'all' || 'legacy-node' }}
    name: Merge and publish ${{ matrix.php_version }}-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.php_version && format('["{0}"]', inputs.php_version) || '["8.5", "8.4", "8.3", "8.2", "8.1", "8.0", "7.4"]') }}
        variant: ['apache','cli','fpm']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ github.repository_owner == 'thecodingmachine' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install regctl
        uses: regclient/actions/regctl-installer@main
        with:
          release: 'v0.8.1'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Fetch the patch version of php
        run: |
          for ARCH in amd64 arm64; do
            IMAGE="ghcr.io/${{ github.repository_owner }}/php:rc${GITHUB_RUN_ID}-${{ matrix.php_version }}-v5-slim-${{ matrix.variant }}-${ARCH}"
            PATCH=$(docker run --rm --platform "linux/${ARCH}" "${IMAGE}" php -r 'echo PHP_VERSION;')
            echo "${ARCH}: ${PATCH}"
            declare "PATCH_${ARCH}=${PATCH}"
          done
          # The X.Y.Z tags are immutable: only published when both archs have the same PHP version
          if [ "${PATCH_amd64}" == "${PATCH_arm64}" ]; then
            PHP_PATCH_MINOR="${PATCH_amd64}"
          else
            PHP_PATCH_MINOR=""
            echo "::warning::amd64 (${PATCH_amd64}) and arm64 (${PATCH_arm64}) differ: the X.Y.Z tags are not published"
          fi
          # The backports of 7.4, 8.0 and 8.1 keep the version number: their X.Y.Z tags need a suffix (e.g. 7.4.33-php2shell)
          if [[ " 7.4 8.0 8.1 " == *" ${{ matrix.php_version }} "* ]]; then
            SUFFIX="${{ inputs.legacy_patch_suffix }}"
            PHP_PATCH_MINOR="${PHP_PATCH_MINOR:+${SUFFIX:+${PHP_PATCH_MINOR}-${SUFFIX}}}"
          fi
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}"
          echo "PHP_PATCH_MINOR=${PHP_PATCH_MINOR}" >> $GITHUB_ENV
      - name: Get list of images for this variant
        id: get-images
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/php" \
          TAG_PREFIX="rc${GITHUB_RUN_ID}-" \
          docker buildx bake \
            --print --progress=quiet \
            ${BAKE_GROUP//.} | jq '.target[].tags // [] | .[]'
      - name: Create multiarch manifests
        run: |
          # Get all targets from the bake group
          TARGETS=$(docker buildx bake ${BAKE_GROUP//.} --progress=quiet --print | jq -r ".group[\"${BAKE_GROUP//.}\"].targets[]")
          # The slim and fat images of the maintained PHP versions are published by the main workflow
          if [[ "${BAKE_GROUP}" == *-legacy-node ]]; then
            TARGETS=$(echo "${TARGETS}" | grep -- '-node')
          fi

          for TARGET in $TARGETS; do
            TAG_ORI=$(REPO="ghcr.io/${{ github.repository_owner }}/php" TAG_PREFIX="rc${GITHUB_RUN_ID}-" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")
            TAG_PATH=$(REPO="php" IS_RELEASE="1" PHP_PATCH_MINOR="${{ env.PHP_PATCH_MINOR }}" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[1]")
            TAG_MINOR=$(REPO="php" docker buildx bake ${TARGET} --progress=quiet --print | jq -r ".target | to_entries[] | select(.key == \"${TARGET}\") | .value.tags[0]")

            # Create manifest for rc tag (always)
            echo "Creating manifest: ${TARGET} - ${TAG_ORI}"
            docker buildx imagetools create --progress=plain -t "${TAG_ORI}" "${TAG_ORI}-amd64" "${TAG_ORI}-arm64"

            # Create manifest for PHP_PATCH
            if [ -n "${PHP_PATCH_MINOR}" ]; then
              regctl image copy "${TAG_ORI}" "ghcr.io/${{ github.repository_owner }}/${TAG_PATH}"
            fi
            # Create manifest for PHP_MINOR
            regctl image copy "${TAG_ORI}" "ghcr.io/${{ github.repository_owner }}/${TAG_MINOR}"

            # SAME FOR DOCKERHUB (for the official repository)
            if [ "${{ github.repository_owner }}" == "thecodingmachine" ]; then
                # Create manifest for PHP_PATCH_MINOR
                if [ -n "${PHP_PATCH_MINOR}" ]; then
                  regctl image copy "${TAG_ORI}" "thecodingmachine/${TAG_PATH}"
                fi
                # Create manifest for PHP_VERSION
                regctl image copy "${TAG_ORI}" "thecodingmachine/${TAG_MINOR}"
            fi
          done

  report:
    if: ${{ !cancelled() && inputs.security_issue }}
    needs:
      - build
      - merge-and-publish
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment the result on the security issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP_VERSION: ${{ inputs.php_version }}
          PACKAGE_AMD64: ${{ inputs.package_amd64 }}
          PACKAGE_ARM64: ${{ inputs.package_arm64 }}
          RESULT: ${{ needs.merge-and-publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ " 7.4 8.0 8.1 " == *" ${PHP_VERSION} "* ]]; then
            IMAGES="\`${PHP_VERSION}-v5-*\` images"
          else
            IMAGES="\`${PHP_VERSION}-v5-*-node18\` and \`-node20\` images"
          fi
          if [ "${RESULT}" == "success" ]; then
            EVENT="published"
            TEXT="✅ PHP ${PHP_VERSION}: ${IMAGES} published (packages ${PACKAGE_AMD64} on amd64, ${PACKAGE_ARM64} on arm64)."
          else
            EVENT="failed"
            TEXT="❌ PHP ${PHP_VERSION}: the build of the ${IMAGES} failed, it is retried automatically."
          fi
          STATE=$(jq -nc --arg php "${PHP_VERSION}" --arg amd64 "${PACKAGE_AMD64}" --arg arm64 "${PACKAGE_ARM64}" \
            --arg event "${EVENT}" --arg run "${GITHUB_RUN_ID}" \
            '{php: $php, amd64: $amd64, arm64: $arm64, event: $event, workflow: "legacy", run: $run}')
          gh issue comment "${{ inputs.security_issue }}" --repo "${{ github.repository }}" \
            --body "${TEXT} [Run](${RUN_URL})"$'\n\n'"<!-- security-watch ${STATE} -->"
