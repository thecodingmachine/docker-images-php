; Loaded after the www.conf file of the Ubuntu package, to override its process manager settings.
; Values are taken from the PHP_FPM_* environment variables (defaults are set in the Dockerfile).

[www]
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Used by php-fpm-healthcheck
ping.path = /ping
