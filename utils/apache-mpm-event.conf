# Up to APACHE_MAX_REQUEST_WORKERS threads, 25 per process
<IfModule mpm_event_module>
	ServerLimit             64
	StartServers            2
	MinSpareThreads         25
	MaxSpareThreads         75
	ThreadLimit             64
	ThreadsPerChild         25
	MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
	MaxConnectionsPerChild  0
</IfModule>
