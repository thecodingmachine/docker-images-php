# Up to APACHE_MAX_REQUEST_WORKERS threads (16 processes of 64 threads at most)
<IfModule mpm_event_module>
	ServerLimit             16
	StartServers            2
	ThreadLimit             64
	ThreadsPerChild         64
	MinSpareThreads         64
	MaxSpareThreads         256
	MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
	MaxConnectionsPerChild  0
</IfModule>
