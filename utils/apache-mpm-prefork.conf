# mod_php: fixed pool of APACHE_MAX_REQUEST_WORKERS processes, each one embedding PHP
<IfModule mpm_prefork_module>
	StartServers            ${APACHE_MAX_REQUEST_WORKERS}
	MinSpareServers         ${APACHE_MAX_REQUEST_WORKERS}
	MaxSpareServers         ${APACHE_MAX_REQUEST_WORKERS}
	ServerLimit             ${APACHE_MAX_REQUEST_WORKERS}
	MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
	MaxConnectionsPerChild  0
</IfModule>
