# Only existing PHP files are sent to PHP-FPM (Apache answers 404 for the others)
<FilesMatch \.php$>
        <If "-f %{REQUEST_FILENAME}">
                SetHandler "proxy:fcgi://127.0.0.1:9000"
        </If>
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory ${ABSOLUTE_APACHE_DOCUMENT_ROOT}>
        Options -Indexes
        AllowOverride All
        # Forward the Authorization header to PHP (HTTP_AUTHORIZATION, PHP_AUTH_USER...)
        CGIPassAuth On
</Directory>
